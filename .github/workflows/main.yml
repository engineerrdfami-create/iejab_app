name: Fresh Demo Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Official Running Flutter App
      run: |
        flutter create clean_iejab_app --org com.iejab.app --project-name iejab_app

    - name: Build Official Running APK
      run: |
        cd clean_iejab_app
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iejab-app-release-apk
        path: clean_iejab_app/build/app/outputs/flutter-apk/app-release.apk
