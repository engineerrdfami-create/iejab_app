name: Deploy Najma App Luxury Dark UI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Official Najma Project
      run: |
        flutter create clean_iejab_app --org com.najma.app --project-name iejab_app
        rm -rf clean_iejab_app/lib/*

    - name: Inject Luxury Dark UI Files
      run: |
        cd clean_iejab_app/lib/
        
        # 1. Main entry file
        cat << 'EOF' > main.dart
        import 'package:flutter/material.dart';
        import 'main_navigation.dart';
        void main() => runApp(const MyApp());
        class MyApp extends StatelessWidget {
          const MyApp({super.key});
          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              title: 'نجمة',
              theme: ThemeData.dark().copyWith(
                scaffoldBackgroundColor: const Color(0xFF0F101D),
                primaryColor: const Color(0xFF6C5CE7),
                colorScheme: const ColorScheme.dark(primary: Color(0xFF6C5CE7), secondary: Color(0xFF00CEC9)),
              ),
              debugShowCheckedModeBanner: false,
              home: const MainNavigationScreen(),
            );
          }
        }
        EOF

        # 2. Main Navigation
        cat << 'EOF' > main_navigation.dart
        import 'package:flutter/material.dart';
        import 'star_chat.dart';
        import 'star_live.dart';
        import 'najma_reels.dart';
        import 'star_market.dart';
        import 'starpay_wallet.dart';
        import 'settings_privacy.dart';
        class MainNavigationScreen extends StatefulWidget {
          const MainNavigationScreen({super.key});
          @override
          State<MainNavigationScreen> createState() => _MainNavigationScreenState();
        }
        class _MainNavigationScreenState extends State<MainNavigationScreen> {
          int _currentIndex = 2; 
          final List<Widget> _screens = [
            const StarChatScreen(),
            const StarLiveScreen(),
            const NajmaReelsScreen(),
            const StarMarketScreen(),
            const StarPayWalletScreen(),
          ];
          @override
          Widget build(BuildContext context) {
            return Scaffold(
              body: Stack(
                children: [
                  _screens[_currentIndex],
                  if (_currentIndex == 4)
                    Positioned(
                      top: 50,
                      left: 20,
                      child: IconButton(
                        icon: const Icon(Icons.settings, color: Colors.white, size: 28),
                        onPressed: () {
                          Navigator.push(
                            context,
                            MaterialPageRoute(builder: (context) => const SettingsPrivacyScreen()),
                          );
                        },
                      ),
                    ),
                ],
              ),
              bottomNavigationBar: BottomNavigationBar(
                currentIndex: _currentIndex,
                type: BottomNavigationBarType.fixed,
                backgroundColor: const Color(0xFF070814),
                selectedItemColor: const Color(0xFF6C5CE7),
                unselectedItemColor: Colors.grey.shade600,
                onTap: (index) => setState(() => _currentIndex = index),
                items: const [
                  BottomNavigationBarItem(icon: Icon(Icons.chat_bubble_outline), activeIcon: Icon(Icons.chat_bubble), label: 'رسائل'),
                  BottomNavigationBarItem(icon: Icon(Icons.live_tv_outlined), activeIcon: Icon(Icons.live_tv), label: 'بث مباشر'),
                  BottomNavigationBarItem(icon: Icon(Icons.play_circle_outline), activeIcon: Icon(Icons.play_circle_fill), label: 'نجمة'),
                  BottomNavigationBarItem(icon: Icon(Icons.explore_outlined), activeIcon: Icon(Icons.explore), label: 'استكشف'),
                  BottomNavigationBarItem(icon: Icon(Icons.account_balance_wallet_outlined), activeIcon: Icon(Icons.account_balance_wallet), label: 'محفظة'),
                ],
              ),
            );
          }
        }
        EOF

        # 3. Star Chat Screen
        cat << 'EOF' > star_chat.dart
        import 'package:flutter/material.dart';
        class StarChatScreen extends StatelessWidget {
          const StarChatScreen({super.key});
          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(title: const Text('رسائل', style: TextStyle(fontWeight: FontWeight.bold)), backgroundColor: const Color(0xFF0F101D), elevation: 0),
              body: ListView.builder(
                itemCount: 5,
                itemBuilder: (context, index) {
                  final names = ['أحمد المقبلي', 'مريم علي', 'فريق الدعم', 'أسامة خالد', 'يسرى محمد'];
                  final msgs = ['مرحباً بك، هل شاهدت البث اليوم؟', 'تم إرسال الهدية بنجاح 🎁', 'كيف يمكننا مساعدتك يا هندسة؟', 'التطبيق فخم جداً عاشت يدك', 'هل رصيد المحفظة محدث؟'];
                  return ListTile(
                    leading: CircleAvatar(backgroundColor: const Color(0xFF6C5CE7), child: Text(names[index][0])),
                    title: Text(names[index], style: const TextStyle(fontWeight: FontWeight.bold)),
                    subtitle: Text(msgs[index], style: const TextStyle(color: Colors.grey)),
                  );
                },
              ),
            );
          }
        }
        EOF

        # 4. Star Live Screen
        cat << 'EOF' > star_live.dart
        import 'package:flutter/material.dart';
        class StarLiveScreen extends StatelessWidget {
          const StarLiveScreen({super.key});
          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(title: const Text('بث مباشر حقيقي', style: TextStyle(fontWeight: FontWeight.bold)), backgroundColor: const Color(0xFF0F101D), elevation: 0),
              body: GridView.builder(
                padding: const EdgeInsets.all(12),
                gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 2, crossAxisSpacing: 12, mainAxisSpacing: 12, childAspectRatio: 0.8),
                itemCount: 2,
                itemBuilder: (context, index) {
                  return Container(
                    decoration: BoxDecoration(color: const Color(0xFF1F2033), borderRadius: BorderRadius.circular(16)),
                    child: const Center(child: Icon(Icons.live_tv, size: 40, color: Colors.white24)),
                  );
                },
              ),
            );
          }
        }
        EOF

        # 5. Najma Reels Screen
        cat << 'EOF' > najma_reels.dart
        import 'package:flutter/material.dart';
        class NajmaReelsScreen extends StatefulWidget {
          const NajmaReelsScreen({super.key});
          @override
          State<NajmaReelsScreen> createState() => _NajmaReelsScreenState();
        }
        class _NajmaReelsScreenState extends State<NajmaReelsScreen> {
          final List<Map<String, String>> _reelsData = [
            {'username': '@jalal_cooking', 'description': 'تحدي طبخ الزربيان العدني على أصوله! 🍲🔥 #نجمة #طبخ_يمني', 'likes': '١.٥ م', 'comments': '٤.٢ ألف'},
            {'username': '@sara_ahmed', 'description': 'طريقة تحضير حلى النجوم الفاخر في ٥ دقائق فقط! ✨🍰', 'likes': '٨٥0 ألف', 'comments': '١.٨ ألف'}
          ];
          @override
          Widget build(BuildContext context) {
            return Scaffold(
              backgroundColor: const Color(0xFF0F101D),
              body: PageView.builder(
                scrollDirection: Axis.vertical,
                itemCount: _reelsData.length,
                itemBuilder: (context, index) {
                  final reel = _reelsData[index];
                  return Stack(
                    children: [
                      const Center(child: Icon(Icons.video_collection, size: 80, color: Colors.white10)),
                      Positioned(bottom: 40, right: 15, child: Column(children: [const Icon(Icons.favorite, color: Colors.redAccent, size: 30), Text(reel['likes']!), const SizedBox(height: 15), const Icon(Icons.chat_bubble, size: 28), Text(reel['comments']!)])),
                      Positioned(bottom: 40, left: 20, right: 80, child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(reel['username']!, style: const TextStyle(fontWeight: FontWeight.bold)), const SizedBox(height: 5), Text(reel['description']!)]))
                    ],
                  );
                },
              ),
            );
          }
        }
        EOF

        # 6. Star Market Screen
        cat << 'EOF' > star_market.dart
        import 'package:flutter/material.dart';
        class StarMarketScreen extends StatelessWidget {
          const StarMarketScreen({super.key});
          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(title: const Text('استكشاف الهاشتاغات', style: TextStyle(fontWeight: FontWeight.bold)), backgroundColor: const Color(0xFF0F101D), elevation: 0),
              body: ListView(padding: const EdgeInsets.all(16), children: const [ListTile(leading: Icon(Icons.tag), title: Text('الموسيقى اليمنية'), subtitle: Text('١.٥ م مشاهدة'))]),
            );
          }
        }
        EOF

        # 7. StarPay Wallet Screen
        cat << 'EOF' > starpay_wallet.dart
        import 'package:flutter/material.dart';
        class StarPayWalletScreen extends StatelessWidget {
          const StarPayWalletScreen({super.key});
