                          'مركز المساعدة',
                        ),
                        _row(
                          Icons.lock_outline,
                          'مركز الخصوصية',
                        ),
                        _row(
                          Icons.info_outline,
                          'الشروط والسياسات',
                        ),
                      ],
                    ),

                    _section(
                      title: 'تسجيل الدخول',
                      items: [
                        _row(
                          Icons.switch_account,
                          'تبديل الحساب',
                        ),
                        _row(
                          Icons.logout,
                          'تسجيل الخروج',
                        ),
                      ],
                    ),

                    const SizedBox(height: 15),

                    const Center(
                      child: Text(
                        'Najma v1.0.0',
                        style: TextStyle(
                          color: Colors.grey,
                          fontSize: 13,
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _section({
              required String title,
              required List<Widget> items,
            }) {
              return Column(
                crossAxisAlignment: CrossAxisAlignment.end,
                children: [
                  Padding(
                    padding: const EdgeInsets.fromLTRB(
                      20,
                      18,
                      20,
                      8,
                    ),
                    child: Text(
                      title,
                      style: const TextStyle(
                        color: Colors.grey,
                        fontSize: 14,
                      ),
                    ),
                  ),
                  Container(
                    margin: const EdgeInsets.symmetric(
                      horizontal: 12,
                    ),
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(14),
                    ),
                    child: Column(
                      children: items,
                    ),
                  ),
                ],
              );
            }

            Widget _row(
              IconData icon,
              String title, {
              String? value,
              bool dot = false,
            }) {
              return ListTile(
                minVerticalPadding: 9,
                leading: Row(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    if (dot)
                      Container(
                        width: 9,
                        height: 9,
                        margin: const EdgeInsets.only(right: 8),
                        decoration: const BoxDecoration(
                          color: Color(0xFFFE2C55),
                          shape: BoxShape.circle,
                        ),
                      ),
                    const Icon(
                      Icons.chevron_left,
                      color: Colors.grey,
                    ),
                  ],
                ),
                trailing: Icon(
                  icon,
                  color: Colors.grey,
                  size: 24,
                ),
                title: Text(
                  title,
                  textAlign: TextAlign.right,
                  style: const TextStyle(
                    fontSize: 16,
                    fontWeight: FontWeight.w600,
                  ),
                ),
                subtitle: value == null
                    ? null
                    : Text(
                        value,
                        textAlign: TextAlign.left,
                        style: const TextStyle(
                          color: Colors.grey,
                        ),
                      ),
                onTap: () {},
              );
            }
          }
          DART

