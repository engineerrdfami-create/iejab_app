name: Build Ejab TikTok-Style Full App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME_AR: "إعجاب"
  APP_NAME_EN: "Ejab"

jobs:
  build:
    name: Build Ejab Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. Flutter
      # =========================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =========================================================
      # 4. Create clean Flutter project
      # =========================================================
      - name: Create Clean Ejab Flutter Project
        shell: bash
        run: |
          set -e

          rm -rf clean_ejab_app

          flutter create \
            --org com.ejab.app \
            --project-name ejab_app \
            --platforms android \
            clean_ejab_app

          cd clean_ejab_app

          rm -rf lib/*
          rm -rf test/*

          mkdir -p lib/screens
          mkdir -p test

      # =========================================================
      # 5. Main Application
      # =========================================================
      - name: Create Main Application
        shell: bash
        run: |
          set -e

          cd clean_ejab_app/lib

          cat > main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'screens/main_navigation.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const EjabApp());
          }

          class EjabApp extends StatelessWidget {
            const EjabApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'إعجاب | Ejab',
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.light,
                  scaffoldBackgroundColor: Colors.white,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFFFE2C55),
                    brightness: Brightness.light,
                  ),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Colors.white,
                    foregroundColor: Colors.black,
                    elevation: 0,
                    surfaceTintColor: Colors.transparent,
                  ),
                ),
                home: const MainNavigationScreen(),
              );
            }
          }
          DART

      # =========================================================
      # 6. Main Navigation
      # =========================================================
      - name: Create Main Navigation
        shell: bash
        run: |
          set -e

          cd clean_ejab_app/lib/screens

          cat > main_navigation.dart <<'DART'
          import 'package:flutter/material.dart';

          import 'home_feed_screen.dart';
          import 'friends_screen.dart';
          import 'create_post_screen.dart';
          import 'inbox_screen.dart';
          import 'profile_screen.dart';

          class MainNavigationScreen extends StatefulWidget {
            const MainNavigationScreen({super.key});

            @override
            State<MainNavigationScreen> createState() =>
                _MainNavigationScreenState();
          }

          class _MainNavigationScreenState
              extends State<MainNavigationScreen> {

            int currentIndex = 0;

            final List<Widget> pages = const [
              HomeFeedScreen(),
              FriendsScreen(),
              SizedBox(),
              InboxScreen(),
              ProfileScreen(),
            ];

            void selectTab(int index) {
              if (index == 2) {
                Navigator.push(
                  context,
                  MaterialPageRoute(
                    builder: (_) => const CreatePostScreen(),
                  ),
                );
                return;
              }

              setState(() {
                currentIndex = index;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  body: IndexedStack(
                    index: currentIndex,
                    children: pages,
                  ),
                  bottomNavigationBar: _bottomNavigation(),
                ),
              );
            }

            Widget _bottomNavigation() {
              return SafeArea(
                top: false,
                child: Container(
                  height: 70,
                  decoration: const BoxDecoration(
                    color: Colors.white,
                    border: Border(
                      top: BorderSide(
                        color: Color(0xFFE5E5E5),
                        width: 0.7,
                      ),
                    ),
                  ),
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.spaceAround,
                    children: [
                      _navItem(
                        icon: Icons.home_rounded,
                        label: 'الرئيسية',
                        index: 0,
                      ),
                      _navItem(
                        icon: Icons.people_outline_rounded,
                        label: 'الأصدقاء',
                        index: 1,
                        badge: '99',
                      ),
                      _createButton(),
                      _navItem(
                        icon: Icons.chat_bubble_outline_rounded,
                        label: 'الوارد',
                        index: 3,
                        badge: '99+',
                      ),
                      _navItem(
                        icon: Icons.person_outline_rounded,
                        label: 'حسابي',
                        index: 4,
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _navItem({
              required IconData icon,
              required String label,
              required int index,
              String? badge,
            }) {
              final bool selected = currentIndex == index;

              return GestureDetector(
                onTap: () => selectTab(index),
                behavior: HitTestBehavior.opaque,
                child: SizedBox(
                  width: 72,
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Stack(
                        clipBehavior: Clip.none,
                        children: [
                          Icon(
                            icon,
                            size: 27,
                            color: selected
                                ? Colors.black
                                : const Color(0xFF777777),
                          ),
                          if (badge != null)
                            Positioned(
                              top: -8,
                              right: -12,
                              child: Container(
                                padding: const EdgeInsets.symmetric(
                                  horizontal: 6,
                                  vertical: 2,
                                ),
                                decoration: BoxDecoration(
                                  color: const Color(0xFFFE2C55),
                                  borderRadius: BorderRadius.circular(20),
                                ),
                                child: Text(
                                  badge,
                                  style: const TextStyle(
                                    color: Colors.white,
                                    fontSize: 9,
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                              ),
                            ),
                        ],
                      ),
                      const SizedBox(height: 3),
                      Text(
                        label,
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                        style: TextStyle(
                          fontSize: 10,
                          color: selected
                              ? Colors.black
                              : const Color(0xFF777777),
                          fontWeight: selected
                              ? FontWeight.bold
                              : FontWeight.normal,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _createButton() {
              return GestureDetector(
                onTap: () => selectTab(2),
                child: Container(
                  width: 50,
                  height: 34,
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(9),
                    gradient: const LinearGradient(
                      colors: [
                        Color(0xFF25F4EE),
                        Color(0xFFFE2C55),
                      ],
                    ),
                  ),
                  padding: const EdgeInsets.all(2),
                  child: Container(
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(7),
                    ),
                    child: const Icon(
                      Icons.add,
                      color: Colors.black,
                      size: 25,
                    ),
                  ),
                ),
              );
            }
          }
          DART

      # =========================================================
      # 7. Home Feed
      # =========================================================
      - name: Create Home Feed
        shell: bash
        run: |
          set -e

          cd clean_ejab_app/lib/screens

          cat > home_feed_screen.dart <<'DART'
          import 'package:flutter/material.dart';

          import 'search_screen.dart';

          class HomeFeedScreen extends StatefulWidget {
            const HomeFeedScreen({super.key});

            @override
            State<HomeFeedScreen> createState() => _HomeFeedScreenState();
          }

          class _HomeFeedScreenState extends State<HomeFeedScreen> {
            bool liked = false;
            bool saved = false;

            int likes = 3179;

            void toggleLike() {
              setState(() {
                liked = !liked;
                likes += liked ? 1 : -1;
              });
            }

            void openComments() {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: Colors.transparent,
                builder: (_) => const CommentsSheet(),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: Stack(
                  children: [
                    Positioned.fill(
                      child: Container(
                        decoration: const BoxDecoration(
                          gradient: LinearGradient(
                            begin: Alignment.topCenter,
                            end: Alignment.bottomCenter,
                            colors: [
                              Color(0xFF000000),
                              Color(0xFF120C12),
                              Color(0xFF2A141F),
                              Color(0xFF000000),
                            ],
                          ),
                        ),
                        child: Center(
                          child: Icon(
                            Icons.play_circle_outline,
                            size: 82,
                            color: Colors.white.withValues(alpha: 0.25),
                          ),
                        ),
                      ),
                    ),

                    SafeArea(
                      child: Row(
                        children: [
                          IconButton(
                            onPressed: () {},
                            icon: const Icon(
                              Icons.live_tv_outlined,
                              color: Colors.white,
                              size: 29,
                            ),
                          ),
                          const Expanded(
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Text(
                                  'لك',
                                  style: TextStyle(
                                    color: Colors.white,
                                    fontSize: 18,
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                                SizedBox(width: 25),
                                Text(
                                  'أتابعه',
                                  style: TextStyle(
                                    color: Colors.white60,
                                    fontSize: 17,
                                  ),
                                ),
                                SizedBox(width: 25),
                                Text(
                                  'المجتمع',
                                  style: TextStyle(
                                    color: Colors.white60,
                                    fontSize: 17,
                                  ),
                                ),
                              ],
                            ),
                          ),
                          IconButton(
                            onPressed: () {
                              Navigator.push(
                                context,
                                MaterialPageRoute(
                                  builder: (_) => const SearchScreen(),
                                ),
                              );
                            },
                            icon: const Icon(
                              Icons.search,
                              color: Colors.white,
                              size: 31,
                            ),
                          ),
                        ],
                      ),
                    ),

                    Positioned(
                      right: 12,
                      bottom: 120,
                      child: Column(
                        children: [
                          _action(
                            icon: Icons.person,
                            text: '+',
                            isAvatar: true,
                          ),
                          const SizedBox(height: 18),

                          GestureDetector(
                            onTap: toggleLike,
                            child: Column(
                              children: [
                                Icon(
                                  liked
                                      ? Icons.favorite
                                      : Icons.favorite_border,
                                  color: liked
                                      ? const Color(0xFFFE2C55)
                                      : Colors.white,
                                  size: 38,
                                ),
                                Text(
                                  '$likes',
                                  style: const TextStyle(
                                    color: Colors.white,
                                    fontSize: 12,
                                  ),
                                ),
                              ],
                            ),
                          ),

                          const SizedBox(height: 18),

                          GestureDetector(
                            onTap: openComments,
                            child: _action(
                              icon: Icons.chat_bubble,
                              text: '33',
                            ),
                          ),

                          const SizedBox(height: 18),

                          GestureDetector(
                            onTap: () {
                              setState(() {
                                saved = !saved;
                              });
                            },
                            child: _action(
                              icon: saved
                                  ? Icons.bookmark
                                  : Icons.bookmark_border,
                              text: '171',
                            ),
                          ),

                          const SizedBox(height: 18),

                          _action(
                            icon: Icons.reply_rounded,
                            text: '22',
                          ),
                        ],
                      ),
                    ),

                    Positioned(
                      right: 18,
                      left: 90,
                      bottom: 28,
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.end,
                        children: const [
                          Text(
                            'Ejab',
                            style: TextStyle(
                              color: Colors.white,
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          SizedBox(height: 7),
                          Text(
                            'مرحباً بك في تطبيق إعجاب ❤️ #foryou #ejab',
                            textAlign: TextAlign.right,
                            style: TextStyle(
                              color: Colors.white,
                              fontSize: 15,
                            ),
                          ),
                          SizedBox(height: 5),
                          Text(
                            '#إعجاب #فيديوهات #محتوى',
                            textAlign: TextAlign.right,
                            style: TextStyle(
                              color: Colors.white70,
                              fontSize: 14,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _action({
              required IconData icon,
              required String text,
              bool isAvatar = false,
            }) {
              return Column(
                children: [
                  Container(
                    width: isAvatar ? 52 : 48,
                    height: isAvatar ? 52 : 48,
                    decoration: BoxDecoration(
                      shape: BoxShape.circle,
                      color: isAvatar
                          ? Colors.white
                          : Colors.transparent,
                    ),
                    child: Icon(
                      icon,
                      color: isAvatar ? Colors.black : Colors.white,
                      size: isAvatar ? 31 : 36,
                    ),
                  ),
                  if (isAvatar)
                    Container(
                      margin: const EdgeInsets.only(top: -12),
                      width: 27,
                      height: 27,
                      decoration: const BoxDecoration(
                        color: Color(0xFFFE2C55),
                        shape: BoxShape.circle,
                      ),
                      child: const Icon(
                        Icons.add,
                        color: Colors.white,
                        size: 20,
                      ),
                    ),
                  Text(
                    text,
                    style: const TextStyle(
                      color: Colors.white,
                      fontSize: 12,
                    ),
                  ),
                ],
              );
            }
          }

          class CommentsSheet extends StatelessWidget {
            const CommentsSheet({super.key});

            @override
            Widget build(BuildContext context) {
              return DraggableScrollableSheet(
                initialChildSize: 0.65,
                minChildSize: 0.35,
                maxChildSize: 0.9,
                builder: (context, controller) {
                  return Container(
                    decoration: const BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.vertical(
                        top: Radius.circular(25),
                      ),
                    ),
                    child: Column(
                      children: [
                        const SizedBox(height: 12),

                        Row(
                          children: [
                            IconButton(
                              onPressed: () => Navigator.pop(context),
                              icon: const Icon(
                                Icons.close,
                                color: Colors.black54,
                              ),
                            ),
                            const Expanded(
                              child: Center(
                                child: Text(
                                  'التعليقات',
                                  style: TextStyle(
                                    color: Colors.black,
                                    fontSize: 17,
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                              ),
                            ),
                            const SizedBox(width: 48),
                          ],
                        ),

                        const Divider(height: 1),

                        Expanded(
                          child: ListView(
                            controller: controller,
                            children: const [
                              _Comment(
                                name: 'مستخدم إعجاب',
                                text: 'ما شاء الله ❤️',
                                likes: '4',
                              ),
                              _Comment(
                                name: 'محمد',
                                text: 'محتوى جميل جداً',
                                likes: '3',
                              ),
                              _Comment(
                                name: 'Ahmed',
                                text: 'رائع 🔥',
                                likes: '2',
                              ),
                              _Comment(
                                name: 'User',
                                text: '❤️❤️❤️',
                                likes: '2',
                              ),
                            ],
                          ),
                        ),

                        SafeArea(
                          top: false,
                          child: Container(
                            padding: const EdgeInsets.all(10),
                            color: Colors.white,
                            child: Row(
                              children: [
                                const Icon(
                                  Icons.alternate_email,
                                  color: Colors.black,
                                ),
                                const SizedBox(width: 10),
                                Expanded(
                                  child: Container(
                                    padding:
                                        const EdgeInsets.symmetric(
                                      horizontal: 15,
                                    ),
                                    decoration: BoxDecoration(
                                      color: const Color(0xFFF1F1F1),
                                      borderRadius:
                                          BorderRadius.circular(25),
                                    ),
                                    child: const TextField(
                                      decoration: InputDecoration(
                                        hintText: 'إضافة تعليق...',
                                        border: InputBorder.none,
                                      ),
                                    ),
                                  ),
                                ),
                                const SizedBox(width: 8),
                                const Icon(
                                  Icons.image_outlined,
                                  color: Colors.black,
                                ),
                              ],
                            ),
                          ),
                        ),
                      ],
                    ),
                  );
                },
              );
            }
          }

          class _Comment extends StatelessWidget {
            final String name;
            final String text;
            final String likes;

            const _Comment({
              required this.name,
              required this.text,
              required this.likes,
            });

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.symmetric(
                  horizontal: 16,
                  vertical: 13,
                ),
                child: Row(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const CircleAvatar(
                      radius: 21,
                      backgroundColor: Color(0xFFE5E5E5),
                      child: Icon(
                        Icons.person,
                        color: Colors.white,
                      ),
                    ),
                    const SizedBox(width: 10),

                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.end,
                        children: [
                          Text(
                            name,
                            style: const TextStyle(
                              color: Colors.black54,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 3),
                          Text(
                            text,
                            textAlign: TextAlign.right,
                            style: const TextStyle(
                              color: Colors.black,
                              fontSize: 15,
                            ),
                          ),
                        ],
                      ),
                    ),

                    const SizedBox(width: 10),

                    Column(
                      children: [
                        const Icon(
                          Icons.favorite_border,
                          color: Colors.grey,
                        ),
                        Text(
                          likes,
                          style: const TextStyle(
                            color: Colors.grey,
                            fontSize: 11,
                          ),
                        ),
                      ],
                    ),
                  ],
                ),
              );
            }
          }
          DART

      # =========================================================
      # 8. Search
      # =========================================================
      - name: Create Search Screen
        shell: bash
        run: |
          set -e

          cd clean_ejab_app/lib/screens

          cat > search_screen.dart <<'DART'
          import 'package:flutter/material.dart';

          class SearchScreen extends StatefulWidget {
            const SearchScreen({super.key});

            @override
            State<SearchScreen> createState() => _SearchScreenState();
          }

          class _SearchScreenState extends State<SearchScreen> {
            final TextEditingController controller =
                TextEditingController();

            final List<String> history = [
              'محتوى عربي',
              'فيديوهات مضحكة',
              'رياضة',
              'كرة القدم',
              'موسيقى',
            ];

            final List<String> suggestions = [
              'أفضل الفيديوهات اليوم',
              'مقاطع جديدة',
              'رياضة',
              'ترفيه',
              'موسيقى',
              'أخبار',
              'تعلم',
              'تقنية',
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.white,
                body: SafeArea(
                  child: Column(
                    children: [
                      Padding(
                        padding: const EdgeInsets.all(10),
                        child: Row(
                          children: [
                            TextButton(
                              onPressed: () {
                                Navigator.pop(context);
                              },
                              child: const Text(
                                'بحث',
                                style: TextStyle(
                                  color: Color(0xFFFE2C55),
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                            ),

                            Expanded(
                              child: Container(
                                height: 46,
                                decoration: BoxDecoration(
                                  color: const Color(0xFFF1F1F1),
                                  borderRadius:
                                      BorderRadius.circular(12),
                                ),
                                child: TextField(
                                  controller: controller,
                                  textDirection: TextDirection.rtl,
                                  decoration: const InputDecoration(
                                    hintText: 'بحث',
                                    prefixIcon: Icon(Icons.search),
                                    suffixIcon: Icon(
                                      Icons.camera_alt_outlined,
                                    ),
                                    border: InputBorder.none,
                                  ),
                                ),
                              ),
                            ),

                            IconButton(
                              onPressed: () {
                                Navigator.pop(context);
                              },
                              icon: const Icon(
                                Icons.arrow_forward,
                                size: 30,
                                color: Colors.black,
                              ),
                            ),
                          ],
                        ),
                      ),

                      Expanded(
                        child: ListView(
                          children: [
                            for (final item in history)
                              ListTile(
                                leading: const Icon(
                                  Icons.close,
                                  color: Colors.grey,
                                ),
                                title: Text(
                                  item,
                                  textAlign: TextAlign.right,
                                ),
                                trailing: const Icon(
                                  Icons.history,
                                  color: Colors.grey,
                                ),
                              ),

                            const Divider(),

                            const Padding(
                              padding: EdgeInsets.all(16),
                              child: Text(
                                'قد يعجبك',
                                textAlign: TextAlign.right,
                                style: TextStyle(
                                  fontWeight: FontWeight.bold,
                                  fontSize: 17,
                                ),
                              ),
                            ),

                            for (final item in suggestions)
                              ListTile(
                                leading: const Icon(
                                  Icons.circle,
                                  size: 8,
                                  color: Color(0xFFFE2C55),
                                ),
                                title: Text(
                                  item,
                                  textAlign: TextAlign.right,
                                ),
                              ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART

      # =========================================================
      # 9. Friends
      # =========================================================
      - name: Create Friends Screen
        shell: bash
        run: |
          set -e

          cd clean_ejab_app/lib/screens

          cat > friends_screen.dart <<'DART'
          import 'package:flutter/material.dart';

          class FriendsScreen extends StatelessWidget {
            const FriendsScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.white,
                appBar: AppBar(
                  title: const Text(
                    'الأصدقاء',
                    style: TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  centerTitle: true,
                ),
                body: ListView(
                  padding: const EdgeInsets.all(18),
                  children: [
                    const Text(
                      'اكتشف أصدقاء جدد',
                      textAlign: TextAlign.right,
                      style: TextStyle(
                        fontSize: 22,
                        fontWeight: FontWeight.bold,
                      ),
                    ),

                    const SizedBox(height: 18),

                    for (int i = 1; i <= 6; i++)
                      Card(
                        elevation: 0,
                        color: const Color(0xFFF7F7F7),
                        child: ListTile(
                          leading: ElevatedButton(
                            onPressed: () {},
                            style: ElevatedButton.styleFrom(
                              backgroundColor:
                                  const Color(0xFFFE2C55),
                              foregroundColor: Colors.white,
                            ),
                            child: const Text('متابعة'),
                          ),
                          trailing: const CircleAvatar(
                            backgroundColor: Color(0xFFE5E5E5),
                            child: Icon(
                              Icons.person,
                              color: Colors.white,
                            ),
                          ),
                          title: Text(
                            'مستخدم إعجاب $i',
                            textAlign: TextAlign.right,
                          ),
