name: Pure Flutter Create and Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Fresh Flutter Project
      run: |
        flutter create fresh_app --org com.iejab.app --project-name iejab_app
        rm -rf fresh_app/lib/*

    - name: Unzip and Inject Custom UI Files
      run: |
        sudo apt-get install -y unzip
        if [ -f lib.zip ]; then
          unzip -o lib.zip -d fresh_app/
        else
          echo "lib.zip not found, skipping extraction"
        fi

    - name: Build Official APK
      run: |
        cd fresh_app
        flutter pub get
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iejab-app-release-apk
        path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
