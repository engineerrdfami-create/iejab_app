name: Build Najma TikTok-Style Full App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Structure
      run: |
        flutter create clean_iejab_app --org com.najma.app --project-name iejab_app
        cd clean_iejab_app
        rm -rf lib/*
        mkdir -p lib/screens

    - name: Inject Complete Application Code
      run: |
        cd clean_iejab_app/lib/

        # 1. Main Entry
        cat << 'EOF' > main.dart
        import 'package:flutter/material.dart';
        import 'screens/main_navigation.dart';

        void main() {
          runApp(const NajmaApp());
        }

        class NajmaApp extends StatelessWidget {
          const NajmaApp({super.key});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              title: 'نجمة | Najma',
              theme: ThemeData.dark().copyWith(
                scaffoldBackgroundColor: Colors.black,
                primaryColor: const Color(0xFFFE2C55),
                colorScheme: const ColorScheme.dark(
                  primary: Color(0xFFFE2C55),
                  surface: Color(0xFF121212),
                ),
              ),
              debugShowCheckedModeBanner: false,
              home: const MainNavigationScreen(),
            );
          }
        }
        EOF

        # 2. Main Navigation Shell (TikTok Bottom Bar)
        cat << 'EOF' > screens/main_navigation.dart
        import 'package:flutter/material.dart';
        import 'home_feed_screen.dart';
        import 'friends_screen.dart';
        import 'create_post_screen.dart';
        import 'inbox_screen.dart';
        import 'profile_screen.dart';

        class MainNavigationScreen extends StatefulWidget {
          const MainNavigationScreen({super.key});

          @override
          State<MainNavigationScreen> createState() => _MainNavigationScreenState();
        }

        class _MainNavigationScreenState extends State<MainNavigationScreen> {
          int _currentIndex = 0;

          final List<Widget> _pages = [
            const HomeFeedScreen(),
            const FriendsScreen(),
            const SizedBox(), // Placeholder for Create (+ button)
            const InboxScreen(),
            const ProfileScreen(),
          ];

          void _onTabTapped(int index) {
            if (index == 2) {
              Navigator.push(context, MaterialPageRoute(builder: (_) => const CreatePostScreen()));
            } else {
              setState(() => _currentIndex = index);
            }
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              body: IndexedStack(index: _currentIndex, children: _pages),
              bottomNavigationBar: Container(
                color: Colors.black,
                height: 60,
                child: Row(
                  mainAxisAlignment: MainAxisAlignment.spaceAround,
                  children: [
                    _buildNavItem(Icons.home, 'الصفحة الرئيسية', 0),
                    _buildNavItem(Icons.people_outline, 'الأصدقاء', 1),
                    _buildCreateButton(),
                    _buildNavItem(Icons.chat_bubble_outline, 'صندوق الوارد', 3, badge: '99+'),
                    _buildNavItem(Icons.person_outline, 'الملف الشخصي', 4),
                  ],
                ),
              ),
            );
          }

          Widget _buildNavItem(IconData icon, String label, int index, {String? badge}) {
            final isSelected = _currentIndex == index;
            return GestureDetector(
              onTap: () => _onTabTapped(index),
              child: Column(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  Stack(
                    clipBehavior: Clip.none,
                    children: [
                      Icon(icon, color: isSelected ? Colors.white : Colors.grey, size: 26),
                      if (badge != null)
                        Positioned(
                          right: -8,
                          top: -4,
                          child: Container(
                            padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 1),
                            decoration: BoxDecoration(color: const Color(0xFFFE2C55), borderRadius: BorderRadius.circular(10)),
                            child: Text(badge, style: const TextStyle(fontSize: 9, color: Colors.white, fontWeight: FontWeight.bold)),
                          ),
                        )
                    ],
                  ),
                  const SizedBox(height: 2),
                  Text(label, style: TextStyle(color: isSelected ? Colors.white : Colors.grey, fontSize: 10)),
                ],
              ),
            );
          }

          Widget _buildCreateButton() {
            return GestureDetector(
              onTap: () => _onTabTapped(2),
              child: Container(
                width: 45,
                height: 30,
                decoration: BoxDecoration(
                  borderRadius: BorderRadius.circular(8),
                  gradient: const LinearGradient(colors: [Colors.cyan, Color(0xFFFE2C55)]),
                ),
                child: Container(
                  margin: const EdgeInsets.symmetric(horizontal: 3),
                  decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(6)),
                  child: const Icon(Icons.add, color: Colors.black, size: 20),
                ),
              ),
            );
          }
        }
        EOF

