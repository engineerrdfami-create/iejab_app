          cd clean_ejab_app

          python3 - <<'PY'
          from pathlib import Path

          for path in Path("lib").rglob("*.dart"):
              text = path.read_text()

              text = text.replace(
                  ".withOpacity(",
                  ".withValues(alpha: "
              )

              path.write_text(text)
          PY

          dart format lib

      # =========================================================
      # 21. Analyze
      # =========================================================
      - name: Analyze Flutter Project
        shell: bash
        run: |
          set -e

          cd clean_ejab_app

          flutter analyze --no-fatal-infos

      # =========================================================
      # 22. Test
      # =========================================================
      - name: Run Flutter Tests
        shell: bash
        run: |
          set -e

          cd clean_ejab_app

          flutter test

      # =========================================================
      # 23. Build Release APK
      # =========================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd clean_ejab_app

          flutter build apk \
            --release

      # =========================================================
      # 24. Prepare APK
      # =========================================================
      - name: Prepare APK Artifact
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp \
            clean_ejab_app/build/app/outputs/flutter-apk/app-release.apk \
            output/Ejab.apk

      # =========================================================
      # 25. Upload APK
      # =========================================================
      - name: Upload Ejab APK
        uses: actions/upload-artifact@v4
        with:
          name: Ejab-Android-App
          path: output/Ejab.apk
          if-no-files-found: error
          retention-days: 30
