name: Build Najma TikTok-Style Full App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Najma Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================================================
      # 2. Java
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      # =========================================================
      # 3. Flutter
      # =========================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =========================================================
      # 4. Create clean Flutter project
      # =========================================================
      - name: Create Najma Flutter Project
        shell: bash
        run: |
          set -e

          rm -rf clean_najma_app

          flutter create \
            --org com.najma.app \
            --project-name najma_app \
            --platforms android \
            clean_najma_app

          cd clean_najma_app

          rm -rf lib/*
          mkdir -p lib/screens

      # =========================================================
      # 5. Main Application
      # =========================================================
      - name: Create Main Application
        shell: bash
        run: |
          set -e
          cd clean_najma_app/lib

          cat > main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'screens/main_navigation.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const NajmaApp());
          }

          class NajmaApp extends StatelessWidget {
            const NajmaApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'نجمة | Najma',
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.light,
                  scaffoldBackgroundColor: Colors.white,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFFFE2C55),
                    brightness: Brightness.light,
                  ),
                  fontFamily: 'sans',
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Colors.white,
                    foregroundColor: Colors.black,
                    elevation: 0,
                    surfaceTintColor: Colors.transparent,
                  ),
                ),
                home: const MainNavigationScreen(),
              );
            }
          }
          DART

      # =========================================================
      # 6. Main Navigation
      # =========================================================
      - name: Create Main Navigation
        shell: bash
        run: |
          set -e
          cd clean_najma_app/lib/screens

          cat > main_navigation.dart <<'DART'
          import 'package:flutter/material.dart';

          import 'home_feed_screen.dart';
          import 'friends_screen.dart';
          import 'create_post_screen.dart';
          import 'inbox_screen.dart';
          import 'profile_screen.dart';

          class MainNavigationScreen extends StatefulWidget {
            const MainNavigationScreen({super.key});

            @override
            State<MainNavigationScreen> createState() =>
                _MainNavigationScreenState();
          }

          class _MainNavigationScreenState
              extends State<MainNavigationScreen> {
            int currentIndex = 0;

            final List<Widget> pages = const [
              HomeFeedScreen(),
              FriendsScreen(),
              SizedBox(),
              InboxScreen(),
              ProfileScreen(),
            ];

            void selectTab(int index) {
              if (index == 2) {
                Navigator.push(
                  context,
                  MaterialPageRoute(
                    builder: (_) => const CreatePostScreen(),
                  ),
                );
                return;
              }

              setState(() {
                currentIndex = index;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  body: IndexedStack(
                    index: currentIndex,
                    children: pages,
                  ),
                  bottomNavigationBar: _bottomNavigation(),
                ),
              );
            }

            Widget _bottomNavigation() {
              return SafeArea(
                top: false,
                child: Container(
                  height: 70,
                  decoration: const BoxDecoration(
                    color: Colors.white,
                    border: Border(
                      top: BorderSide(
                        color: Color(0xFFE5E5E5),
                        width: 0.7,
                      ),
                    ),
                  ),
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.spaceAround,
                    children: [
                      _navItem(
                        icon: Icons.home_rounded,
                        label: 'الصفحة الرئيسية',
                        index: 0,
                      ),
                      _navItem(
                        icon: Icons.people_outline_rounded,
                        label: 'الأصدقاء',
                        index: 1,
                        badge: '99',
                      ),
                      _createButton(),
                      _navItem(
                        icon: Icons.chat_bubble_outline_rounded,
                        label: 'صندوق الوارد',
                        index: 3,
                        badge: '99+',
                      ),
                      _navItem(
                        icon: Icons.person_outline_rounded,
                        label: 'الملف الشخصي',
                        index: 4,
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _navItem({
              required IconData icon,
              required String label,
              required int index,
              String? badge,
            }) {
              final bool selected = currentIndex == index;

              return GestureDetector(
                onTap: () => selectTab(index),
                behavior: HitTestBehavior.opaque,
                child: SizedBox(
                  width: 72,
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Stack(
                        clipBehavior: Clip.none,
                        children: [
                          Icon(
                            icon,
                            size: 27,
                            color: selected
                                ? Colors.black
                                : const Color(0xFF777777),
                          ),
                          if (badge != null)
                            Positioned(
                              top: -8,
                              right: -12,
                              child: Container(
                                padding: const EdgeInsets.symmetric(
                                  horizontal: 6,
                                  vertical: 2,
                                ),
                                decoration: BoxDecoration(
                                  color: const Color(0xFFFE2C55),
                                  borderRadius: BorderRadius.circular(20),
                                ),
                                child: Text(
                                  badge,
                                  style: const TextStyle(
                                    color: Colors.white,
                                    fontSize: 9,
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                              ),
                            ),
                        ],
                      ),
                      const SizedBox(height: 3),
                      Text(
                        label,
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                        style: TextStyle(
                          fontSize: 10,
                          color: selected
                              ? Colors.black
                              : const Color(0xFF777777),
                          fontWeight:
                              selected ? FontWeight.bold : FontWeight.normal,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _createButton() {
              return GestureDetector(
                onTap: () => selectTab(2),
                child: Container(
                  width: 50,
                  height: 34,
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(9),
                    gradient: const LinearGradient(
                      colors: [
                        Color(0xFF25F4EE),
                        Color(0xFFFE2C55),
                      ],
                    ),
                  ),
                  padding: const EdgeInsets.all(2),
                  child: Container(
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(7),
                    ),
                    child: const Icon(
                      Icons.add,
                      color: Colors.black,
                      size: 25,
                    ),
                  ),
                ),
              );
            }
          }
          DART

      # =========================================================
      # 7. Home Feed
      # =========================================================
      - name: Create Home Feed
        shell: bash
        run: |
          set -e
          cd clean_najma_app/lib/screens

          cat > home_feed_screen.dart <<'DART'
          import 'package:flutter/material.dart';

          import 'search_screen.dart';

          class HomeFeedScreen extends StatefulWidget {
            const HomeFeedScreen({super.key});

            @override
            State<HomeFeedScreen> createState() => _HomeFeedScreenState();
          }

          class _HomeFeedScreenState extends State<HomeFeedScreen> {
            bool liked = false;
            bool saved = false;

            int likes = 3179;

            void toggleLike() {
              setState(() {
                liked = !liked;
                likes += liked ? 1 : -1;
              });
            }

            void openComments() {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: Colors.transparent,
                builder: (_) => const CommentsSheet(),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: Stack(
                  children: [
                    Positioned.fill(
                      child: Container(
                        decoration: const BoxDecoration(
                          gradient: LinearGradient(
                            begin: Alignment.topCenter,
                            end: Alignment.bottomCenter,
                            colors: [
                              Color(0xFF000000),
                              Color(0xFF120C12),
                              Color(0xFF2A141F),
                              Color(0xFF000000),
                            ],
                          ),
                        ),
                        child: Center(
                          child: Icon(
                            Icons.play_circle_outline,
                            size: 82,
                            color: Colors.white.withOpacity(0.25),
                          ),
                        ),
                      ),
                    ),

                    SafeArea(
                      child: Column(
                        children: [
                          Padding(
                            padding: const EdgeInsets.symmetric(
                              horizontal: 12,
                              vertical: 8,
                            ),
                            child: Row(
                              children: [
                                IconButton(
                                  onPressed: () {},
                                  icon: const Icon(
                                    Icons.live_tv_outlined,
                                    color: Colors.white,
                                    size: 29,
                                  ),
                                ),
                                Expanded(
                                  child: Row(
                                    mainAxisAlignment:
                                        MainAxisAlignment.center,
                                    children: const [
                                      Text(
                                        'لك',
                                        style: TextStyle(
                                          color: Colors.white,
                                          fontSize: 18,
                                          fontWeight: FontWeight.bold,
                                        ),
                                      ),
                                      SizedBox(width: 25),
                                      Text(
                                        'أتابعه',
                                        style: TextStyle(
                                          color: Colors.white60,
                                          fontSize: 17,
                                        ),
                                      ),
                                      SizedBox(width: 25),
                                      Text(
                                        'المجتمع',
                                        style: TextStyle(
                                          color: Colors.white60,
                                          fontSize: 17,
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                                IconButton(
                                  onPressed: () {
                                    Navigator.push(
                                      context,
                                      MaterialPageRoute(
                                        builder: (_) => const SearchScreen(),
                                      ),
                                    );
                                  },
                                  icon: const Icon(
                                    Icons.search,
                                    color: Colors.white,
                                    size: 31,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ],
                      ),
                    ),

                    Positioned(
                      right: 12,
                      bottom: 120,
                      child: Column(
                        children: [
                          _action(
                            icon: Icons.person,
                            text: '+',
                            isAvatar: true,
                          ),
                          const SizedBox(height: 18),
                          GestureDetector(
                            onTap: toggleLike,
                            child: Column(
                              children: [
                                Icon(
                                  liked
                                      ? Icons.favorite
                                      : Icons.favorite_border,
                                  color: liked
                                      ? const Color(0xFFFE2C55)
                                      : Colors.white,
                                  size: 38,
                                ),
                                Text(
                                  '$likes',
                                  style: const TextStyle(
                                    color: Colors.white,
                                    fontSize: 12,
                                  ),
                                ),
                              ],
                            ),
                          ),
                          const SizedBox(height: 18),
                          GestureDetector(
                            onTap: openComments,
                            child: _action(
                              icon: Icons.chat_bubble,
                              text: '33',
                            ),
                          ),
                          const SizedBox(height: 18),
                          GestureDetector(
                            onTap: () {
                              setState(() {
                                saved = !saved;
                              });
                            },
                            child: _action(
                              icon: saved
                                  ? Icons.bookmark
                                  : Icons.bookmark_border,
                              text: '171',
                            ),
                          ),
                          const SizedBox(height: 18),
                          _action(
                            icon: Icons.reply_rounded,
                            text: '22',
                          ),
                        ],
                      ),
                    ),

                    Positioned(
                      right: 18,
                      left: 90,
                      bottom: 28,
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.end,
                        children: const [
                          Text(
                            'Boxing.sr',
                            style: TextStyle(
                              color: Colors.white,
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          SizedBox(height: 7),
                          Text(
                            'Price Nassem 👑 #foryoupage #boxingtok',
                            textAlign: TextAlign.right,
                            style: TextStyle(
                              color: Colors.white,
                              fontSize: 15,
                            ),
                          ),
                          SizedBox(height: 5),
                          Text(
                            '#pricenassem #allahhuakbar #boxing',
                            textAlign: TextAlign.right,
                            style: TextStyle(
                              color: Colors.white70,
                              fontSize: 14,
                            ),
                          ),
                          SizedBox(height: 10),
                          Text(
                            'أشار المبدع إلى أنه من إنتاج الذكاء الاصطناعي',
                            style: TextStyle(
                              color: Colors.white70,
                              fontSize: 12,
                            ),
                          ),
                          SizedBox(height: 4),
                          Text(
                            'انظر الترجمة',
                            style: TextStyle(
                              color: Colors.white54,
                              fontSize: 12,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _action({
              required IconData icon,
              required String text,
              bool isAvatar = false,
            }) {
              return Column(
                children: [
                  Container(
                    width: isAvatar ? 52 : 48,
                    height: isAvatar ? 52 : 48,
                    decoration: BoxDecoration(
                      shape: BoxShape.circle,
                      color: isAvatar
                          ? Colors.white
                          : Colors.transparent,
                    ),
                    child: Icon(
                      icon,
                      color: isAvatar ? Colors.black : Colors.white,
                      size: isAvatar ? 31 : 36,
                    ),
                  ),
                  if (isAvatar)
                    Container(
                      margin: const EdgeInsets.only(top: -12),
                      width: 27,
                      height: 27,
                      decoration: const BoxDecoration(
                        color: Color(0xFFFE2C55),
                        shape: BoxShape.circle,
                      ),
                      child: const Icon(
                        Icons.add,
                        color: Colors.white,
                        size: 20,
                      ),
                    ),
                  Text(
                    text,
                    style: const TextStyle(
                      color: Colors.white,
                      fontSize: 12,
                    ),
                  ),
                ],
              );
            }
          }

          class CommentsSheet extends StatelessWidget {
            const CommentsSheet({super.key});

            @override
            Widget build(BuildContext context) {
              return DraggableScrollableSheet(
                initialChildSize: 0.65,
                minChildSize: 0.35,
                maxChildSize: 0.9,
                builder: (context, controller) {
                  return Container(
                    decoration: const BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.vertical(
                        top: Radius.circular(25),
                      ),
                    ),
                    child: Column(
                      children: [
                        const SizedBox(height: 12),
                        Row(
                          children: [
                            IconButton(
                              onPressed: () => Navigator.pop(context),
                              icon: const Icon(
                                Icons.close,
                                color: Colors.black54,
                              ),
                            ),
                            const Expanded(
                              child: Center(
                                child: Text(
                                  '33 تعليقًا',
                                  style: TextStyle(
                                    color: Colors.black,
                                    fontSize: 17,
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                              ),
                            ),
                            const SizedBox(width: 48),
                          ],
                        ),
                        const Divider(height: 1),
                        Expanded(
                          child: ListView(
                            controller: controller,
                            children: const [
                              _Comment(
                                name: 'جهاز المخابرات العامة',
                                text: 'الله أكبر الله أكبر',
                                likes: '4',
                              ),
                              _Comment(
                                name: 'Haitam dj',
                                text: 'مشاء الله عليك',
                                likes: '3',
                              ),
                              _Comment(
                                name: 'yönsé',
                                text: 'نقول إلى الجنة 🥰🥰⚡',
                                likes: '2',
                              ),
                              _Comment(
                                name: 'Lashari',
                                text:
                                    'This is the best boxer and shahzada off Islam ❤️',
                                likes: '2',
                              ),
                              _Comment(
                                name: 'mustafaeIach',
                                text: '🥰🥰🥰',
                                likes: '1',
                              ),
                            ],
                          ),
                        ),
                        SafeArea(
                          top: false,
                          child: Container(
                            padding: const EdgeInsets.all(10),
                            color: Colors.white,
                            child: Row(
                              children: [
                                const Icon(
                                  Icons.alternate_email,
                                  color: Colors.black,
                                ),
                                const SizedBox(width: 10),
                                Expanded(
                                  child: Container(
                                    padding: const EdgeInsets.symmetric(
                                      horizontal: 15,
                                    ),
                                    decoration: BoxDecoration(
                                      color: const Color(0xFFF1F1F1),
                                      borderRadius: BorderRadius.circular(25),
                                    ),
                                    child: const TextField(
                                      decoration: InputDecoration(
                                        hintText: 'إضافة تعليق...',
                                        border: InputBorder.none,
                                      ),
                                    ),
                                  ),
                                ),
                                const SizedBox(width: 8),
                                const Icon(
                                  Icons.image_outlined,
                                  color: Colors.black,
                                ),
                              ],
                            ),
                          ),
                        ),
                      ],
                    ),
                  );
                },
              );
            }
          }

          class _Comment extends StatelessWidget {
            final String name;
            final String text;
            final String likes;

            const _Comment({
              required this.name,
              required this.text,
              required this.likes,
            });

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.symmetric(
                  horizontal: 16,
                  vertical: 13,
                ),
                child: Row(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const CircleAvatar(
                      radius: 21,
                      backgroundColor: Color(0xFFE5E5E5),
                      child: Icon(
                        Icons.person,
                        color: Colors.white,
                      ),
                    ),
                    const SizedBox(width: 10),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.end,
                        children: [
                          Text(
                            name,
                            style: const TextStyle(
                              color: Colors.black54,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 3),
                          Text(
                            text,
                            textAlign: TextAlign.right,
                            style: const TextStyle(
                              color: Colors.black,
                              fontSize: 15,
