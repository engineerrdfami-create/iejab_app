name: Build Najma Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Najma APK
    runs-on: ubuntu-latest

    steps:

      # 1 - تحميل المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2 - تثبيت Java
      # لا نستخدم gradle/actions/setup-gradle هنا
      # لأن مشروع Flutter سيتم إنشاؤه لاحقاً
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3 - تثبيت Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      # 4 - التحقق من Flutter
      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      # 5 - إنشاء مشروع Najma
      - name: Create Najma Flutter Project
        run: |
          rm -rf najma_app

          flutter create \
            --org com.najma.app \
            --project-name najma \
            --platforms android \
            najma_app

      # 6 - الانتقال إلى المشروع
      - name: Enter Najma Project
        run: |
          cd najma_app
          flutter pub get

      # 7 - إنشاء مجلدات التطبيق
      - name: Create App Structure
        run: |
          cd najma_app

          mkdir -p lib/screens
          mkdir -p lib/widgets
          mkdir -p lib/models
          mkdir -p lib/services
          mkdir -p lib/theme
          mkdir -p assets/images
          mkdir -p assets/videos

      # 8 - فحص مشروع Flutter
      - name: Flutter Analyze
        run: |
          cd najma_app
          flutter analyze

      # 9 - تنسيق Dart
      - name: Format Dart
        run: |
          cd najma_app
          dart format lib

      # 10 - جلب الحزم مرة أخرى
      - name: Flutter Pub Get
        run: |
          cd najma_app
          flutter pub get

      # 11 - بناء APK Release
      - name: Build Release APK
        run: |
          cd najma_app
          flutter build apk --release

      # 12 - تجهيز APK
      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp najma_app/build/app/outputs/flutter-apk/app-release.apk \
             output/Najma-release.apk

      # 13 - رفع APK
      - name: Upload Najma APK
        uses: actions/upload-artifact@v4
        with:
          name: Najma-Android-APK
          path: output/Najma-release.apk
          if-no-files-found: error
