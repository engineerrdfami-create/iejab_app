name: Build Najma Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Najma APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # 1. تحميل المشروع
      # --------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------
      # 2. تثبيت Flutter
      # --------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # --------------------------------
      # 3. إنشاء مشروع Flutter إذا لم يكن موجودًا
      # --------------------------------
      - name: Create Najma Flutter Project
        shell: bash
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "Flutter project not found."
            echo "Creating Najma Flutter project..."

            flutter create . \
              --project-name=najma \
              --org=com.najma.app \
              --platforms=android

          else
            echo "Flutter project already exists."
          fi


      # --------------------------------
      # 4. التحقق من Flutter
      # --------------------------------
      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v


      # --------------------------------
      # 5. تثبيت Java
      # --------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------
      # 6. إعداد Android SDK
      # --------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # --------------------------------
      # 7. إنشاء مجلدات المشروع
      # --------------------------------
      - name: Create App Structure
        shell: bash
        run: |
          mkdir -p assets
          mkdir -p lib
          mkdir -p lib/screens
          mkdir -p lib/widgets
          mkdir -p lib/models
          mkdir -p lib/services


      # --------------------------------
      # 8. تحميل الحزم
      # --------------------------------
      - name: Flutter Pub Get
        run: |
          flutter pub get


      # --------------------------------
      # 9. فحص المشروع
      # --------------------------------
      - name: Flutter Analyze
        run: |
          flutter analyze


      # --------------------------------
      # 10. تنسيق Dart
      # --------------------------------
      - name: Format Dart Code
        run: |
          dart format lib


      # --------------------------------
      # 11. بناء APK
      # --------------------------------
      - name: Build Release APK
        run: |
          flutter build apk --release


      # --------------------------------
      # 12. تجهيز ملف APK
      # --------------------------------
      - name: Prepare APK Artifact
        shell: bash
        run: |
          mkdir -p build/najma-apk
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/najma-apk/Najma.apk


      # --------------------------------
      # 13. رفع APK إلى GitHub
      # --------------------------------
      - name: Upload Najma APK
        uses: actions/upload-artifact@v4
        with:
          name: Najma-Android-APK
          path: build/najma-apk/Najma.apk
          if-no-files-found: error


      # --------------------------------
      # 14. نجاح البناء
      # --------------------------------
      - name: Build Complete
        run: |
          echo "======================================"
          echo "Najma Android APK built successfully!"
          echo "======================================"
