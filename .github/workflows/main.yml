name: Ultimate Fix and Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Fresh Flutter Project
      run: |
        flutter create fresh_app --org com.iejab.app --project-name iejab_app
        rm -rf fresh_app/lib/*

    - name: Unzip Project Files
      run: |
        sudo apt-get install -y unzip
        unzip -o lib.zip -d fresh_app/ || true

    - name: Strict Shell Auto-Fix for Code Errors
      run: |
        cd fresh_app/lib/
        
        # 1. Fix Dollar signs syntax in star_market.dart
        if [ -f star_market.dart ]; then
          sed -i 's/\x27$ \x27/\x27\\$ \x27/g' star_market.dart
        fi
        
        # 2. Fix duplicate itemCount in star_chat.dart
        if [ -f star_chat.dart ]; then
          sed -i 's/itemCount: itemCount:/itemCount:/g' star_chat.dart
        fi
        
        # 3. Fix white90 color object in najma_reels.dart
        if [ -f najma_reels.dart ]; then
          sed -i 's/white90/Colors.white70/g' najma_reels.dart
        fi
        
        # 4. Fix white60 color object in star_live.dart
        if [ -f star_live.dart ]; then
          sed -i 's/white60/Colors.white60/g' star_live.dart
        fi

    - name: Build Official Release APK
      run: |
        cd fresh_app
        flutter pub get
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iejab-app-release-apk
        path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
        
