name: Deploy Najma Full Interactive App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Najma Flutter Interactive Project
      run: |
        flutter create clean_iejab_app --org com.najma.app --project-name iejab_app
        cd clean_iejab_app
        rm -rf lib/*

    - name: Inject Interactive Code Structure
      run: |
        cd clean_iejab_app/lib/

        # 1. Main Entry
        cat << 'EOF' > main.dart
        import 'package:flutter/material.dart';
        import 'login_screen.dart';

        void main() {
          runApp(const NajmaApp());
        }

        class NajmaApp extends StatelessWidget {
          const NajmaApp({super.key});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              title: 'تطبيق نجمة - Najma',
              theme: ThemeData.dark().copyWith(
                scaffoldBackgroundColor: const Color(0xFF0D0E1A),
                primaryColor: const Color(0xFF6C5CE7),
                colorScheme: const ColorScheme.dark(
                  primary: Color(0xFF6C5CE7),
                  secondary: Color(0xFF00CEC9),
                  surface: Color(0xFF16182E),
                ),
              ),
              debugShowCheckedModeBanner: false,
              home: const LoginScreen(),
            );
          }
        }
        EOF

        # 2. Login Screen
        cat << 'EOF' > login_screen.dart
        import 'package:flutter/material.dart';
        import 'main_navigation.dart';

        class LoginScreen extends StatefulWidget {
          const LoginScreen({super.key});

          @override
          State<LoginScreen> createState() => _LoginScreenState();
        }

        class _LoginScreenState extends State<LoginScreen> {
          final _phoneController = TextEditingController();
          final _passController = TextEditingController();

          void _login() {
            if (_phoneController.text.isNotEmpty && _passController.text.isNotEmpty) {
              Navigator.pushReplacement(
                context,
                MaterialPageRoute(builder: (context) => const MainNavigationScreen()),
              );
            } else {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('يرجى إدخال رقم الهاتف وكلمة المرور')),
              );
            }
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              body: Padding(
                padding: const EdgeInsets.all(24.0),
                child: Column(
                  mainAxisAlignment: MainAxisAlignment.center,
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    const Icon(Icons.star_rounded, size: 80, color: Color(0xFF6C5CE7)),
                    const SizedBox(height: 10),
                    const Text(
                      'نجمة - Najma',
                      textAlign: TextAlign.center,
                      style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 30),
                    TextField(
                      controller: _phoneController,
                      keyboardType: TextInputType.phone,
                      decoration: InputDecoration(
                        labelText: 'رقم الهاتف / البريد الإلكتروني',
                        prefixIcon: const Icon(Icons.phone_android),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        filled: true,
                        fillColor: const Color(0xFF16182E),
                      ),
                    ),
                    const SizedBox(height: 15),
                    TextField(
                      controller: _passController,
                      obscureText: true,
                      decoration: InputDecoration(
                        labelText: 'كلمة المرور',
                        prefixIcon: const Icon(Icons.lock),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        filled: true,
                        fillColor: const Color(0xFF16182E),
                      ),
                    ),
                    const SizedBox(height: 25),
                    ElevatedButton(
                      onPressed: _login,
                      style: ElevatedButton.styleFrom(
                        backgroundColor: const Color(0xFF6C5CE7),
                        padding: const EdgeInsets.symmetric(vertical: 16),
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      ),
                      child: const Text('تسجيل الدخول', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white)),
                    ),
                    const SizedBox(height: 15),
                    TextButton(
                      onPressed: () {
                        Navigator.pushReplacement(
                          context,
                          MaterialPageRoute(builder: (context) => const MainNavigationScreen()),
                        );
                      },
                      child: const Text('الدخول كزائر', style: TextStyle(color: Colors.white70)),
                    )
                  ],
                ),
              ),
            );
          }
        }
        EOF

        # 3. Main Navigation
        cat << 'EOF' > main_navigation.dart
        import 'package:flutter/material.dart';
        import 'najma_reels.dart';
        import 'star_chat.dart';
        import 'star_live.dart';
        import 'star_market.dart';
        import 'starpay_wallet.dart';

        class MainNavigationScreen extends StatefulWidget {
          const MainNavigationScreen({super.key});

          @override
          State<MainNavigationScreen> createState() => _MainNavigationScreenState();
        }

        class _MainNavigationScreenState extends State<MainNavigationScreen> {
          int _currentIndex = 2;

          final List<Widget> _screens = [
            const StarChatScreen(),
            const StarLiveScreen(),
            const NajmaReelsScreen(),
            const StarMarketScreen(),
            const StarPayWalletScreen(),
          ];

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              body: IndexedStack(
                index: _currentIndex,
                children: _screens,
              ),
              bottomNavigationBar: BottomNavigationBar(
                currentIndex: _currentIndex,
                type: BottomNavigationBarType.fixed,
                backgroundColor: const Color(0xFF070814),
                selectedItemColor: const Color(0xFF6C5CE7),
                unselectedItemColor: Colors.grey.shade500,
                onTap: (index) => setState(() => _currentIndex = index),
                items: const [
                  BottomNavigationBarItem(icon: Icon(Icons.chat_bubble_outline), activeIcon: Icon(Icons.chat_bubble), label: 'رسائل'),
                  BottomNavigationBarItem(icon: Icon(Icons.live_tv_outlined), activeIcon: Icon(Icons.live_tv), label: 'بث مباشر'),
                  BottomNavigationBarItem(icon: Icon(Icons.play_circle_outline, size: 28), activeIcon: Icon(Icons.play_circle_fill, size: 28), label: 'نجمة'),
                  BottomNavigationBarItem(icon: Icon(Icons.explore_outlined), activeIcon: Icon(Icons.explore), label: 'استكشف'),
                  BottomNavigationBarItem(icon: Icon(Icons.account_balance_wallet_outlined), activeIcon: Icon(Icons.account_balance_wallet), label: 'محفظة'),
                ],
              ),
            );
          }
        }
        EOF

        # 4. Interactive Services Screens
        cat << 'EOF' > najma_reels.dart
        import 'package:flutter/material.dart';

        class NajmaReelsScreen extends StatefulWidget {
          const NajmaReelsScreen({super.key});

          @override
          State<NajmaReelsScreen> createState() => _NajmaReelsScreenState();
        }

        class _NajmaReelsScreenState extends State<NajmaReelsScreen> {
          bool isLiked = false;
          int likesCount = 1500;

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              backgroundColor: Colors.black,
              body: Stack(
                fit: StackFit.expand,
                children: [
                  Image.network(
                    'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800',
                    fit: BoxFit.cover,
                  ),
                  Container(
                    decoration: const BoxDecoration(
                      gradient: LinearGradient(
                        colors: [Colors.black54, Colors.transparent, Colors.black87],
                        begin: Alignment.topCenter,
                        end: Alignment.bottomCenter,
                      ),
                    ),
                  ),
                  Positioned(
                    bottom: 40,
                    right: 15,
                    child: Column(
                      children: [
                        IconButton(
                          icon: Icon(Icons.favorite, color: isLiked ? Colors.red : Colors.white, size: 38),
                          onPressed: () {
                            setState(() {
                              isLiked = !isLiked;
                              likesCount += isLiked ? 1 : -1;
                            });
                          },
                        ),
                        Text('$likesCount', style: const TextStyle(color: Colors.white)),
                        const SizedBox(height: 20),
                        IconButton(
                          icon: const Icon(Icons.comment, color: Colors.white, size: 34),
                          onPressed: () {
                            showModalBottomSheet(
                              context: context,
                              builder: (context) => Container(
                                padding: const EdgeInsets.all(16),
                                child: Column(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    const Text('التعليقات الحية', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                                    const SizedBox(height: 10),
                                    const ListTile(title: Text('أحمد المقبلي'), subtitle: Text('تطبيق فخم جداً عاشت يدك!')),
                                    TextField(
                                      decoration: InputDecoration(
                                        hintText: 'إضافة تعليق...',
                                        suffixIcon: IconButton(
                                          icon: const Icon(Icons.send),
                                          onPressed: () {
                                            Navigator.pop(context);
                                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تم نشر التعليق')));
                                          },
                                        ),
                                      ),
                                    )
                                  ],
                                ),
                              ),
                            );
                          },
                        ),
                        const Text('تعليق', style: TextStyle(color: Colors.white)),
                      ],
                    ),
                  ),
                  Positioned(
                    bottom: 40,
                    left: 20,
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: const [
                        Text('@jalal_cooking', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
                        SizedBox(height: 5),
                        Text('تحدي طبخ الزربيان العدني على أصوله! 🔥', style: TextStyle(color: Colors.white70)),
                      ],
                    ),
                  )
                ],
              ),
            );
          }
        }
        EOF

        cat << 'EOF' > starpay_wallet.dart
        import 'package:flutter/material.dart';

        class StarPayWalletScreen extends StatelessWidget {
          const StarPayWalletScreen({super.key});

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(title: const Text('المحفظة الرقمية'), backgroundColor: const Color(0xFF16182E)),
              body: Padding(
                padding: const EdgeInsets.all(16.0),
                child: Column(
                  children: [
                    Container(
                      width: double.infinity,
                      padding: const EdgeInsets.all(20),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(colors: [Color(0xFF6C5CE7), Color(0xFF00CEC9)]),
                        borderRadius: BorderRadius.circular(15),
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: const [
                          Text('رصيد أرباح نجمة', style: TextStyle(color: Colors.white70)),
                          SizedBox(height: 10),
                          Text('\$150.00', style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold, color: Colors.white)),
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),
                    ListTile(
                      leading: const Icon(Icons.add_circle_outline, color: Color(0xFF00CEC9)),
                      title: const Text('شحن النجوم'),
                      onTap: () {
                        ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('فتح بوابات الدفع وشحن النجوم')));
                      },
                    ),
                    ListTile(
                      leading: const Icon(Icons.history, color: Color(0xFF6C5CE7)),
                      title: const Text('سجل المعاملات والتحويلات'),
                      onTap: () {
                        ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('عرض سجل المعاملات السابقة')));
                      },
                    ),
                  ],
                ),
              ),
            );
          }
        }
        EOF

        cat << 'EOF' > star_live.dart
        import 'package:flutter/material.dart';

        class StarLiveScreen extends StatelessWidget {
          const StarLiveScreen({super.key});

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(title: const Text('غرف البث المباشر'), backgroundColor: const Color(0xFF16182E)),
              body: ListView.builder(
                itemCount: 3,
                itemBuilder: (context, index) {
                  return Card(
                    margin: const EdgeInsets.all(10),
                    child: ListTile(
                      leading: const CircleAvatar(backgroundColor: Colors.red, child: Icon(Icons.live_tv, color: Colors.white)),
                      title: Text('بث مباشر رقم #${index + 1}'),
                      subtitle: const Text('انقر للانضمام والمشاركة في البث الحقيقي'),
                      onTap: () {
                        ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('تم الانضمام للبث المباشر #${index + 1}')));
                      },
                    ),
                  );
                },
              ),
            );
          }
        }
        EOF

        cat << 'EOF' > star_chat.dart
        import 'package:flutter/material.dart';

        class StarChatScreen extends StatelessWidget {
          const StarChatScreen({super.key});

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(title: const Text('الرسائل الخاصة'), backgroundColor: const Color(0xFF16182E)),
              body: ListView(
                children: [
                  ListTile(
                    leading: const CircleAvatar(child: Text('أ')),
                    title: const Text('أحمد المقبلي'),
                    subtitle: const Text('مرحباً بك، هل شاهدت البث اليوم؟'),
                    onTap: () {
                      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('فتح المحادثة الخاصة مع أحمد')));
                    },
                  ),
                  ListTile(
                    leading: const CircleAvatar(child: Text('ف')),
                    title: const Text('فريق دعم نجمة'),
                    subtitle: const Text('كيف يمكننا مساعدتك اليوم؟'),
                    onTap: () {
                      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('الاتصال بالدعم الفني')));
                    },
                  ),
                ],
              ),
            );
          }
        }
        EOF

        cat << 'EOF' > star_market.dart
        import 'package:flutter/material.dart';

        class StarMarketScreen extends StatelessWidget {
          const StarMarketScreen({super.key});

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(title: const Text('استكشاف الهاشتاغات'), backgroundColor: const Color(0xFF16182E)),
              body: Padding(
                padding: const EdgeInsets.all(16.0),
                child: Column(
                  children: [
                    TextField(
                      decoration: InputDecoration(
                        hintText: 'ابحث عن صانع محتوى أو فيديو...',
                        prefixIcon: const Icon(Icons.search),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        filled: true,
                        fillColor: const Color(0xFF16182E),
                      ),
                    ),
                    const SizedBox(height: 20),
                    ListTile(
                      leading: const Icon(Icons.tag, color: Color(0xFF6C5CE7)),
                      title: const Text('طبخ_يمني'),
                      subtitle: const Text('1.5M مشاهدة'),
                      onTap: () {
                        ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تصفح الفيديوهات الخاصة بهذا الهاشتاغ')));
                      },
                    ),
                  ],
                ),
              ),
            );
          }
        }
        EOF

    - name: Build APK
      run: |
        cd clean_iejab_app
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: najma-interactive-app-release
        path: clean_iejab_app/build/app/outputs/flutter-apk/app-release.apk
