      # =========================================================
      # 16. Android App Label
      # =========================================================
      - name: Configure Android App
        shell: bash
        run: |
          set -e
          cd clean_najma_app

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          text = p.read_text()

          text = text.replace(
              'android:label="najma_app"',
              'android:label="نجمة | Najma"'
          )

          p.write_text(text)
          PY

      # =========================================================
      # 17. Dependencies
      # =========================================================
      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e
          cd clean_najma_app
          flutter pub get

      # =========================================================
      # 18. Format
      # =========================================================
      - name: Format Dart Code
        shell: bash
        run: |
          set -e
          cd clean_najma_app
          dart format lib

      # =========================================================
      # 19. Analyze
      # =========================================================
      - name: Analyze Flutter Project
        shell: bash
        run: |
          set -e
          cd clean_najma_app
          flutter analyze

      # =========================================================
      # 20. Build Release APK
      # =========================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e
          cd clean_najma_app

          flutter build apk \
            --release \
            --split-per-abi=false

      # =========================================================
      # 21. Copy APK with simple name
      # =========================================================
      - name: Prepare APK Artifact
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp \
            clean_najma_app/build/app/outputs/flutter-apk/app-release.apk \
            output/Najma.apk

      # =========================================================
      # 22. Upload APK
      # =========================================================
      - name: Upload Najma APK
        uses: actions/upload-artifact@v4
        with:
          name: Najma-Android-App
          path: output/Najma.apk
          if-no-files-found: error
          retention-days: 30
