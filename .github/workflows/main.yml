                              ),
                            ),
                            IconButton(
                              onPressed: () => Navigator.pop(context),
                              icon: const Icon(
                                Icons.arrow_forward,
                                size: 30,
                                color: Colors.black,
                              ),
                            ),
                          ],
                        ),
                      ),
                      Expanded(
                        child: ListView(
                          children: [
                            for (final item in history)
                              ListTile(
                                leading: const Icon(
                                  Icons.close,
                                  color: Colors.grey,
                                ),
                                title: Text(
                                  item,
                                  textAlign: TextAlign.right,
                                ),
                                trailing: const Icon(
                                  Icons.history,
                                  color: Colors.grey,
                                ),
                              ),
                            const Divider(),
                            const Padding(
                              padding: EdgeInsets.all(16),
                              child: Text(
                                'قد يعجبك',
                                textAlign: TextAlign.right,
                                style: TextStyle(
                                  fontWeight: FontWeight.bold,
                                  fontSize: 17,
                                ),
                              ),
                            ),
                            for (int i = 0; i < suggestions.length; i++)
                              ListTile(
                                leading: Icon(
                                  Icons.circle,
                                  size: 8,
                                  color: i < 2
                                      ? const Color(0xFFFE2C55)
                                      : Colors.grey,
                                ),
                                title: Text(
                                  suggestions[i],
                                  textAlign: TextAlign.right,
                                ),
                                subtitle: const Text(
                                  'شاهدته للتو',
                                  textAlign: TextAlign.right,
                                  style: TextStyle(
                                    color: Colors.grey,
                                    fontSize: 12,
                                  ),
                                ),
                              ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
